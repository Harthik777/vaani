932\u093E \u0906\u0923\u093F Grade-B \u0906\u092F\u0930\u094D\u0928 \u0906\u0932\u093E \u0924\u0930 \u092A\u0915\u094D\u0915\u0940 \u0911\u0930\u094D\u0921\u0930 \u0928\u0938\u0924\u093E\u0928\u093E \u0924\u0940\u0928 \u0926\u093F\u0935\u0938 \u0916\u0930\u0947\u0926\u0940 \u0925\u093E\u0902\u092C\u0935\u0924\u094B. \u0938\u094D\u0915\u094D\u0930\u0945\u092A \u092F\u0940\u0932\u094D\u0921 70% \u092A\u0947\u0915\u094D\u0937\u093E \u0915\u092E\u0940 \u0905\u0938\u0947\u0932 \u0924\u0930 \u0916\u0930\u0947\u0926\u0940 \u092C\u0902\u0926. \u092A\u093E\u0935\u0938\u093E\u0933\u094D\u092F\u093E\u0924 15 \u0926\u093F\u0935\u0938 \u0906\u0927\u0940 \u0911\u0930\u094D\u0921\u0930 \u0926\u0947\u0924\u094B.",tamil:"\u0B9F\u0BBE\u0BB2\u0BB0\u0BCD \u0B89\u0BAF\u0BB0\u0BCD\u0BA8\u0BCD\u0BA4\u0BC1 Grade-B \u0B87\u0BB0\u0BC1\u0BAE\u0BCD\u0BAA\u0BC1 \u0BB5\u0BA8\u0BCD\u0BA4\u0BBE\u0BB2\u0BCD, \u0B89\u0BB1\u0BC1\u0BA4\u0BBF\u0BAF\u0BBE\u0BA9 \u0B86\u0BB0\u0BCD\u0B9F\u0BB0\u0BCD \u0B87\u0BB2\u0BCD\u0BB2\u0BBE\u0BA4\u0BAA\u0BCB\u0BA4\u0BC1 \u0BAE\u0BC2\u0BA9\u0BCD\u0BB1\u0BC1 \u0BA8\u0BBE\u0B9F\u0BCD\u0B95\u0BB3\u0BCD \u0BB5\u0BBE\u0B99\u0BCD\u0B95\u0BC1\u0BB5\u0BA4\u0BC8 \u0BA8\u0BBF\u0BB1\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1\u0BB5\u0BC7\u0BA9\u0BCD. \u0BB8\u0BCD\u0B95\u0BBF\u0BB0\u0BBE\u0BAA\u0BCD \u0BB5\u0BBF\u0BB3\u0BC8\u0B9A\u0BCD\u0B9A\u0BB2\u0BCD 70%-\u0B95\u0BCD\u0B95\u0BC1 \u0B95\u0BC0\u0BB4\u0BC7 \u0B87\u0BB0\u0BC1\u0BA8\u0BCD\u0BA4\u0BBE\u0BB2\u0BCD \u0BB5\u0BBE\u0B99\u0BCD\u0B95\u0BC1\u0BB5\u0BA4\u0BC8 \u0BA8\u0BBF\u0BB1\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1\u0BB5\u0BC7\u0BA9\u0BCD. \u0BAE\u0BB4\u0BC8\u0B95\u0BCD\u0B95\u0BBE\u0BB2\u0BA4\u0BCD\u0BA4\u0BBF\u0BB2\u0BCD 15 \u0BA8\u0BBE\u0B9F\u0BCD\u0B95\u0BB3\u0BCD \u0BAE\u0BC1\u0BA9\u0BCD\u0BAA\u0BC7 \u0B86\u0BB0\u0BCD\u0B9F\u0BB0\u0BCD \u0B9A\u0BC6\u0BAF\u0BCD\u0BB5\u0BC7\u0BA9\u0BCD.",telugu:"\u0C21\u0C3E\u0C32\u0C30\u0C4D \u0C2A\u0C46\u0C30\u0C3F\u0C17\u0C3F Grade-B \u0C07\u0C28\u0C41\u0C2E\u0C41 \u0C35\u0C38\u0C4D\u0C24\u0C47, \u0C16\u0C30\u0C3E\u0C30\u0C48\u0C28 \u0C06\u0C30\u0C4D\u0C21\u0C30\u0C4D \u0C32\u0C47\u0C15\u0C2A\u0C4B\u0C24\u0C47 \u0C2E\u0C42\u0C21\u0C41 \u0C30\u0C4B\u0C1C\u0C41\u0C32\u0C41 \u0C15\u0C4A\u0C28\u0C41\u0C17\u0C4B\u0C33\u0C4D\u0C32\u0C41 \u0C06\u0C2A\u0C41\u0C24\u0C3E\u0C28\u0C41. \u0C38\u0C4D\u0C15\u0C4D\u0C30\u0C3E\u0C2A\u0C4D \u0C26\u0C3F\u0C17\u0C41\u0C2C\u0C21\u0C3F 70% \u0C15\u0C02\u0C1F\u0C47 \u0C24\u0C15\u0C4D\u0C15\u0C41\u0C35\u0C48\u0C24\u0C47 \u0C15\u0C4A\u0C28\u0C21\u0C02 \u0C06\u0C2A\u0C41\u0C24\u0C3E\u0C28\u0C41. \u0C35\u0C30\u0C4D\u0C37\u0C3E\u0C15\u0C3E\u0C32\u0C02\u0C32\u0C4B 15 \u0C30\u0C4B\u0C1C\u0C41\u0C32 \u0C2E\u0C41\u0C02\u0C26\u0C47 \u0C06\u0C30\u0C4D\u0C21\u0C30\u0C4D \u0C07\u0C38\u0C4D\u0C24\u0C3E\u0C28\u0C41.",bengali:"\u09A1\u09B2\u09BE\u09B0\u09C7\u09B0 \u09A6\u09BE\u09AE \u09AC\u09BE\u09A1\u09BC\u09B2\u09C7 \u098F\u09AC\u0982 Grade-B \u09B2\u09CB\u09B9\u09BE \u098F\u09B2\u09C7 \u09A8\u09BF\u09B6\u09CD\u099A\u09BF\u09A4 \u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u09A8\u09BE \u09A5\u09BE\u0995\u09B2\u09C7 \u09A4\u09BF\u09A8 \u09A6\u09BF\u09A8 \u0995\u09C7\u09A8\u09BE \u09AC\u09A8\u09CD\u09A7 \u09B0\u09BE\u0996\u09BF\u0964 \u09B8\u09CD\u0995\u09CD\u09B0\u09CD\u09AF\u09BE\u09AA\u09C7\u09B0 \u09AB\u09B2\u09A8 70%-\u098F\u09B0 \u09A8\u09BF\u099A\u09C7 \u09B9\u09B2\u09C7 \u0995\u09C7\u09A8\u09BE \u09AC\u09A8\u09CD\u09A7\u0964 \u09AC\u09B0\u09CD\u09B7\u09BE\u09AF\u09BC 15 \u09A6\u09BF\u09A8 \u0986\u0997\u09C7 \u0985\u09B0\u09CD\u09A1\u09BE\u09B0 \u0995\u09B0\u09BF\u0964",kannada:"\u0CA1\u0CBE\u0CB2\u0CB0\u0CCD \u0C8F\u0CB0\u0CBF\u0CA6\u0CBE\u0C97 \u0CAE\u0CA4\u0CCD\u0CA4\u0CC1 Grade-B \u0C95\u0CAC\u0CCD\u0CAC\u0CBF\u0CA3 \u0CAC\u0C82\u0CA6\u0CBE\u0C97, \u0C96\u0C9A\u0CBF\u0CA4 \u0C86\u0CB0\u0CCD\u0CA1\u0CB0\u0CCD \u0C87\u0CB2\u0CCD\u0CB2\u0CA6\u0CBF\u0CA6\u0CCD\u0CA6\u0CB0\u0CC6 \u0CA8\u0CBE\u0CA8\u0CC1 \u0CAE\u0CC2\u0CB0\u0CC1 \u0CA6\u0CBF\u0CA8 \u0C96\u0CB0\u0CC0\u0CA6\u0CBF \u0CA8\u0CBF\u0CB2\u0CCD\u0CB2\u0CBF\u0CB8\u0CC1\u0CA4\u0CCD\u0CA4\u0CC7\u0CA8\u0CC6. \u0CB8\u0CCD\u0C95\u0CCD\u0CB0\u0CCD\u0CAF\u0CBE\u0CAA\u0CCD \u0CAF\u0CC0\u0CB2\u0CCD\u0CA1\u0CCD 70% \u0C95\u0CCD\u0C95\u0CBF\u0C82\u0CA4 \u0C95\u0CA1\u0CBF\u0CAE\u0CC6\u0CAF\u0CBE\u0CA6\u0CB0\u0CC6 \u0C96\u0CB0\u0CC0\u0CA6\u0CBF \u0CA8\u0CBF\u0CB2\u0CCD\u0CB2\u0CBF\u0CB8\u0CC1\u0CA4\u0CCD\u0CA4\u0CC7\u0CA8\u0CC6. \u0CAE\u0CB3\u0CC6\u0C97\u0CBE\u0CB2\u0CA6\u0CB2\u0CCD\u0CB2\u0CBF 15 \u0CA6\u0CBF\u0CA8 \u0CAE\u0CC1\u0C82\u0C9A\u0CC6 \u0C86\u0CB0\u0CCD\u0CA1\u0CB0\u0CCD \u0CAE\u0CBE\u0CA1\u0CC1\u0CA4\u0CCD\u0CA4\u0CC7\u0CA8\u0CC6."},awareness:{english:"All citizens please note: for the next seven days, boil river water before drinking. Clear stagnant water in coolers, planters and open containers every Sunday. If fever exceeds 101\xB0F, visit the nearest Primary Health Center. Call helpline 104.",hindi:"\u0938\u092D\u0940 \u0928\u093E\u0917\u0930\u093F\u0915 \u0927\u094D\u092F\u093E\u0928 \u0926\u0947\u0902\u0964 \u0905\u0917\u0932\u0947 \u0938\u093E\u0924 \u0926\u093F\u0928\u094B\u0902 \u0924\u0915 \u0928\u0926\u0940 \u0915\u093E \u092A\u093E\u0928\u0940 \u0909\u092C\u093E\u0932\u0915\u0930 \u092A\u093F\u090F\u0901\u0964 \u0939\u0930 \u0930\u0935\u093F\u0935\u093E\u0930 \u0915\u0942\u0932\u0930, \u0917\u092E\u0932\u094B\u0902 \u0914\u0930 \u0916\u0941\u0932\u0947 \u092C\u0930\u094D\u0924\u0928\u094B\u0902 \u0915\u093E \u091C\u092E\u093E \u092A\u093E\u0928\u0940 \u0938\u093E\u092B \u0915\u0930\u0947\u0902\u0964 \u092C\u0941\u0916\u093E\u0930 101\xB0F \u0938\u0947 \u090A\u092A\u0930 \u0939\u094B \u0924\u094B \u0928\u091C\u0926\u0940\u0915\u0940 \u092A\u094D\u0930\u093E\u0925\u092E\u093F\u0915 \u0938\u094D\u0935\u093E\u0938\u094D\u0925\u094D\u092F \u0915\u0947\u0902\u0926\u094D\u0930 \u091C\u093E\u090F\u0901\u0964 \u0939\u0947\u0932\u094D\u092A\u0932\u093E\u0907\u0928 104 \u092A\u0930 \u0915\u0949\u0932 \u0915\u0930\u0947\u0902\u0964",marathi:"\u0938\u0930\u094D\u0935 \u0928\u093E\u0917\u0930\u093F\u0915\u093E\u0902\u0928\u0940 \u0932\u0915\u094D\u0937 \u0926\u094D\u092F\u093E\u0935\u0947. \u092A\u0941\u0922\u0940\u0932 \u0938\u093E\u0924 \u0926\u093F\u0935\u0938 \u0928\u0926\u0940\u091A\u0947 \u092A\u093E\u0923\u0940 \u0909\u0915\u0933\u0942\u0928 \u092A\u094D\u092F\u093E. \u0926\u0930 \u0930\u0935\u093F\u0935\u093E\u0930\u0940 \u0915\u0941\u0932\u0930, \u0915\u0941\u0902\u0921\u094D\u092F\u093E \u0906\u0923\u093F \u0909\u0918\u0921\u094D\u092F\u093E \u092D\u093E\u0902\u0921\u094D\u092F\u093E\u0902\u0924\u0940\u0932 \u0938\u093E\u091A\u0932\u0947\u0932\u0947 \u092A\u093E\u0923\u0940 \u0938\u093E\u092B \u0915\u0930\u093E. \u0924\u093E\u092A 101\xB0F \u092A\u0947\u0915\u094D\u0937\u093E \u091C\u093E\u0938\u094D\u0924 \u0905\u0938\u0932\u094D\u092F\u093E\u0938 \u091C\u0935\u0933\u091A\u094D\u092F\u093E \u092A\u094D\u0930\u093E\u0925\u092E\u093F\u0915 \u0906\u0930\u094B\u0917\u094D\u092F \u0915\u0947\u0902\u0926\u094D\u0930\u093E\u0924 \u091C\u093E. 104 \u0939\u0947\u0932\u094D\u092A\u0932\u093E\u0907\u0928\u0935\u0930 \u092B\u094B\u0928 \u0915\u0930\u093E.",tamil:"\u0B85\u0BA9\u0BC8\u0BA4\u0BCD\u0BA4\u0BC1 \u0B95\u0BC1\u0B9F\u0BBF\u0BAE\u0B95\u0BCD\u0B95\u0BB3\u0BC1\u0BAE\u0BCD \u0B95\u0BB5\u0BA9\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD. \u0B85\u0B9F\u0BC1\u0BA4\u0BCD\u0BA4 \u0B8F\u0BB4\u0BC1 \u0BA8\u0BBE\u0B9F\u0BCD\u0B95\u0BB3\u0BC1\u0B95\u0BCD\u0B95\u0BC1 \u0B86\u0BB1\u0BCD\u0BB1\u0BC1 \u0BA8\u0BC0\u0BB0\u0BC8\u0B95\u0BCD \u0B95\u0BCA\u0BA4\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC8\u0BA4\u0BCD\u0BA4\u0BC1\u0B95\u0BCD \u0B95\u0BC1\u0B9F\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD. \u0B92\u0BB5\u0BCD\u0BB5\u0BCA\u0BB0\u0BC1 \u0B9E\u0BBE\u0BAF\u0BBF\u0BB1\u0BC1\u0BAE\u0BCD \u0B95\u0BC2\u0BB2\u0BB0\u0BCD, \u0BAA\u0BC2\u0BA8\u0BCD\u0BA4\u0BCA\u0B9F\u0BCD\u0B9F\u0BBF \u0BAE\u0BB1\u0BCD\u0BB1\u0BC1\u0BAE\u0BCD \u0BA4\u0BBF\u0BB1\u0BA8\u0BCD\u0BA4 \u0BAA\u0BBE\u0BA4\u0BCD\u0BA4\u0BBF\u0BB0\u0B99\u0BCD\u0B95\u0BB3\u0BBF\u0BB2\u0BCD \u0BA4\u0BC7\u0B99\u0BCD\u0B95\u0BBF\u0BAF \u0BA8\u0BC0\u0BB0\u0BC8 \u0B85\u0B95\u0BB1\u0BCD\u0BB1\u0BB5\u0BC1\u0BAE\u0BCD. \u0B95\u0BBE\u0BAF\u0BCD\u0B9A\u0BCD\u0B9A\u0BB2\u0BCD 101\xB0F-\u0B90 \u0BAE\u0BC0\u0BB1\u0BBF\u0BA9\u0BBE\u0BB2\u0BCD \u0B85\u0BB0\u0BC1\u0B95\u0BBF\u0BB2\u0BC1\u0BB3\u0BCD\u0BB3 \u0B86\u0BB0\u0BAE\u0BCD\u0BAA \u0B9A\u0BC1\u0B95\u0BBE\u0BA4\u0BBE\u0BB0 \u0BA8\u0BBF\u0BB2\u0BC8\u0BAF\u0BA4\u0BCD\u0BA4\u0BBF\u0BB1\u0BCD\u0B95\u0BC1\u0B9A\u0BCD \u0B9A\u0BC6\u0BB2\u0BCD\u0BB2\u0BB5\u0BC1\u0BAE\u0BCD. 104 \u0B89\u0BA4\u0BB5\u0BBF \u0B8E\u0BA3\u0BCD\u0BA3\u0BC8 \u0B85\u0BB4\u0BC8\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD.",telugu:"\u0C2A\u0C4C\u0C30\u0C41\u0C32\u0C02\u0C26\u0C30\u0C42 \u0C17\u0C2E\u0C28\u0C3F\u0C02\u0C1A\u0C02\u0C21\u0C3F. \u0C35\u0C1A\u0C4D\u0C1A\u0C47 \u0C0F\u0C21\u0C41 \u0C30\u0C4B\u0C1C\u0C41\u0C32\u0C41 \u0C28\u0C26\u0C3F \u0C28\u0C40\u0C1F\u0C3F\u0C28\u0C3F \u0C2E\u0C30\u0C3F\u0C17\u0C3F\u0C02\u0C1A\u0C3F \u0C24\u0C3E\u0C17\u0C02\u0C21\u0C3F. \u0C2A\u0C4D\u0C30\u0C24\u0C3F \u0C06\u0C26\u0C3F\u0C35\u0C3E\u0C30\u0C02 \u0C15\u0C42\u0C32\u0C30\u0C4D\u0C32\u0C41, \u0C2E\u0C4A\u0C15\u0C4D\u0C15\u0C32 \u0C15\u0C41\u0C02\u0C21\u0C40\u0C32\u0C41, \u0C24\u0C46\u0C30\u0C3F\u0C1A\u0C3F\u0C28 \u0C2A\u0C3E\u0C24\u0C4D\u0C30\u0C32\u0C32\u0C4B \u0C28\u0C3F\u0C32\u0C3F\u0C1A\u0C3F\u0C28 \u0C28\u0C40\u0C1F\u0C3F\u0C28\u0C3F \u0C24\u0C4A\u0C32\u0C17\u0C3F\u0C02\u0C1A\u0C02\u0C21\u0C3F. \u0C1C\u0C4D\u0C35\u0C30\u0C02 101\xB0F \u0C26\u0C3E\u0C1F\u0C3F\u0C24\u0C47 \u0C38\u0C2E\u0C40\u0C2A \u0C2A\u0C4D\u0C30\u0C3E\u0C25\u0C2E\u0C3F\u0C15 \u0C06\u0C30\u0C4B\u0C17\u0C4D\u0C2F \u0C15\u0C47\u0C02\u0C26\u0C4D\u0C30\u0C3E\u0C28\u0C3F\u0C15\u0C3F \u0C35\u0C46\u0C33\u0C4D\u0C32\u0C02\u0C21\u0C3F. 104 \u0C39\u0C46\u0C32\u0C4D\u0C2A\u0C4D\u200C\u0C32\u0C48\u0C28\u0C4D\u200C\u0C15\u0C41 \u0C15\u0C3E\u0C32\u0C4D \u0C1A\u0C47\u0C2F\u0C02\u0C21\u0C3F.",bengali:"\u09B8\u0995\u09B2 \u09A8\u09BE\u0997\u09B0\u09BF\u0995 \u0996\u09C7\u09AF\u09BC\u09BE\u09B2 \u0995\u09B0\u09C1\u09A8\u0964 \u0986\u0997\u09BE\u09AE\u09C0 \u09B8\u09BE\u09A4 \u09A6\u09BF\u09A8 \u09A8
