D\u092F\u093E\u0935\u0947. \u092A\u0941\u0922\u0940\u0932 \u0938\u093E\u0924 \u0926\u093F\u0935\u0938 \u0928\u0926\u0940\u091A\u0947 \u092A\u093E\u0923\u0940 \u0909\u0915\u0933\u0942\u0928 \u092A\u094D\u092F\u093E. \u0926\u0930 \u0930\u0935\u093F\u0935\u093E\u0930\u0940 \u0915\u0941\u0932\u0930, \u0915\u0941\u0902\u0921\u094D\u092F\u093E \u0906\u0923\u093F \u0909\u0918\u0921\u094D\u092F\u093E \u092D\u093E\u0902\u0921\u094D\u092F\u093E\u0902\u0924\u0940\u0932 \u0938\u093E\u091A\u0932\u0947\u0932\u0947 \u092A\u093E\u0923\u0940 \u0938\u093E\u092B \u0915\u0930\u093E. \u0924\u093E\u092A 101\xB0F \u092A\u0947\u0915\u094D\u0937\u093E \u091C\u093E\u0938\u094D\u0924 \u0905\u0938\u0932\u094D\u092F\u093E\u0938 \u091C\u0935\u0933\u091A\u094D\u092F\u093E \u092A\u094D\u0930\u093E\u0925\u092E\u093F\u0915 \u0906\u0930\u094B\u0917\u094D\u092F \u0915\u0947\u0902\u0926\u094D\u0930\u093E\u0924 \u091C\u093E. 104 \u0939\u0947\u0932\u094D\u092A\u0932\u093E\u0907\u0928\u0935\u0930 \u092B\u094B\u0928 \u0915\u0930\u093E.",tamil:"\u0B85\u0BA9\u0BC8\u0BA4\u0BCD\u0BA4\u0BC1 \u0B95\u0BC1\u0B9F\u0BBF\u0BAE\u0B95\u0BCD\u0B95\u0BB3\u0BC1\u0BAE\u0BCD \u0B95\u0BB5\u0BA9\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD. \u0B85\u0B9F\u0BC1\u0BA4\u0BCD\u0BA4 \u0B8F\u0BB4\u0BC1 \u0BA8\u0BBE\u0B9F\u0BCD\u0B95\u0BB3\u0BC1\u0B95\u0BCD\u0B95\u0BC1 \u0B86\u0BB1\u0BCD\u0BB1\u0BC1 \u0BA8\u0BC0\u0BB0\u0BC8\u0B95\u0BCD \u0B95\u0BCA\u0BA4\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC8\u0BA4\u0BCD\u0BA4\u0BC1\u0B95\u0BCD \u0B95\u0BC1\u0B9F\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD. \u0B92\u0BB5\u0BCD\u0BB5\u0BCA\u0BB0\u0BC1 \u0B9E\u0BBE\u0BAF\u0BBF\u0BB1\u0BC1\u0BAE\u0BCD \u0B95\u0BC2\u0BB2\u0BB0\u0BCD, \u0BAA\u0BC2\u0BA8\u0BCD\u0BA4\u0BCA\u0B9F\u0BCD\u0B9F\u0BBF \u0BAE\u0BB1\u0BCD\u0BB1\u0BC1\u0BAE\u0BCD \u0BA4\u0BBF\u0BB1\u0BA8\u0BCD\u0BA4 \u0BAA\u0BBE\u0BA4\u0BCD\u0BA4\u0BBF\u0BB0\u0B99\u0BCD\u0B95\u0BB3\u0BBF\u0BB2\u0BCD \u0BA4\u0BC7\u0B99\u0BCD\u0B95\u0BBF\u0BAF \u0BA8\u0BC0\u0BB0\u0BC8 \u0B85\u0B95\u0BB1\u0BCD\u0BB1\u0BB5\u0BC1\u0BAE\u0BCD. \u0B95\u0BBE\u0BAF\u0BCD\u0B9A\u0BCD\u0B9A\u0BB2\u0BCD 101\xB0F-\u0B90 \u0BAE\u0BC0\u0BB1\u0BBF\u0BA9\u0BBE\u0BB2\u0BCD \u0B85\u0BB0\u0BC1\u0B95\u0BBF\u0BB2\u0BC1\u0BB3\u0BCD\u0BB3 \u0B86\u0BB0\u0BAE\u0BCD\u0BAA \u0B9A\u0BC1\u0B95\u0BBE\u0BA4\u0BBE\u0BB0 \u0BA8\u0BBF\u0BB2\u0BC8\u0BAF\u0BA4\u0BCD\u0BA4\u0BBF\u0BB1\u0BCD\u0B95\u0BC1\u0B9A\u0BCD \u0B9A\u0BC6\u0BB2\u0BCD\u0BB2\u0BB5\u0BC1\u0BAE\u0BCD. 104 \u0B89\u0BA4\u0BB5\u0BBF \u0B8E\u0BA3\u0BCD\u0BA3\u0BC8 \u0B85\u0BB4\u0BC8\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD.",telugu:"\u0C2A\u0C4C\u0C30\u0C41\u0C32\u0C02\u0C26\u0C30\u0C42 \u0C17\u0C2E\u0C28\u0C3F\u0C02\u0C1A\u0C02\u0C21\u0C3F. \u0C35\u0C1A\u0C4D\u0C1A\u0C47 \u0C0F\u0C21\u0C41 \u0C30\u0C4B\u0C1C\u0C41\u0C32\u0C41 \u0C28\u0C26\u0C3F \u0C28\u0C40\u0C1F\u0C3F\u0C28\u0C3F \u0C2E\u0C30\u0C3F\u0C17\u0C3F\u0C02\u0C1A\u0C3F \u0C24\u0C3E\u0C17\u0C02\u0C21\u0C3F. \u0C2A\u0C4D\u0C30\u0C24\u0C3F \u0C06\u0C26\u0C3F\u0C35\u0C3E\u0C30\u0C02 \u0C15\u0C42\u0C32\u0C30\u0C4D\u0C32\u0C41, \u0C2E\u0C4A\u0C15\u0C4D\u0C15\u0C32 \u0C15\u0C41\u0C02\u0C21\u0C40\u0C32\u0C41, \u0C24\u0C46\u0C30\u0C3F\u0C1A\u0C3F\u0C28 \u0C2A\u0C3E\u0C24\u0C4D\u0C30\u0C32\u0C32\u0C4B \u0C28\u0C3F\u0C32\u0C3F\u0C1A\u0C3F\u0C28 \u0C28\u0C40\u0C1F\u0C3F\u0C28\u0C3F \u0C24\u0C4A\u0C32\u0C17\u0C3F\u0C02\u0C1A\u0C02\u0C21\u0C3F. \u0C1C\u0C4D\u0C35\u0C30\u0C02 101\xB0F \u0C26\u0C3E\u0C1F\u0C3F\u0C24\u0C47 \u0C38\u0C2E\u0C40\u0C2A \u0C2A\u0C4D\u0C30\u0C3E\u0C25\u0C2E\u0C3F\u0C15 \u0C06\u0C30\u0C4B\u0C17\u0C4D\u0C2F \u0C15\u0C47\u0C02\u0C26\u0C4D\u0C30\u0C3E\u0C28\u0C3F\u0C15\u0C3F \u0C35\u0C46\u0C33\u0C4D\u0C32\u0C02\u0C21\u0C3F. 104 \u0C39\u0C46\u0C32\u0C4D\u0C2A\u0C4D\u200C\u0C32\u0C48\u0C28\u0C4D\u200C\u0C15\u0C41 \u0C15\u0C3E\u0C32\u0C4D \u0C1A\u0C47\u0C2F\u0C02\u0C21\u0C3F.",bengali:"\u09B8\u0995\u09B2 \u09A8\u09BE\u0997\u09B0\u09BF\u0995 \u0996\u09C7\u09AF\u09BC\u09BE\u09B2 \u0995\u09B0\u09C1\u09A8\u0964 \u0986\u0997\u09BE\u09AE\u09C0 \u09B8\u09BE\u09A4 \u09A6\u09BF\u09A8 \u09A8 irement quotes the speaker exactly.":"\u0939\u0930 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E \u0935\u0915\u094D\u0924\u093E \u0915\u094B \u0920\u0940\u0915-\u0920\u0940\u0915 \u0909\u0926\u094D\u0927\u0943\u0924 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964",Verified:"\u0938\u0924\u094D\u092F\u093E\u092A\u093F\u0924","A number nobody said is blocked, visibly.":"\u090F\u0915 \u0928\u0902\u092C\u0930 \u091C\u093F\u0938\u0947 \u0915\u093F\u0938\u0940 \u0928\u0947 \u0928\u0939\u0940\u0902 \u0915\u0939\u093E, \u0935\u0939 \u0938\u094D\u092A\u0937\u094D\u091F \u0930\u0942\u092A \u0938\u0947 \u0905\u0935\u0930\u0941\u0926\u094D\u0927 \u0939\u0948\u0964",Voices:"\u0906\u0935\u093E\u091C\u093C\u0947\u0902","Owner and manager disagreements are caught, with both clips.":"\u092E\u093E\u0932\u093F\u0915 \u0914\u0930 \u092A\u094D\u0930\u092C\u0902\u0927\u0915 \u0915\u0947 \u092C\u0940\u091A \u0905\u0938\u0939\u092E\u0924\u093F \u0926\u094B\u0928\u094B\u0902 \u0915\u094D\u0932\u093F\u092A \u0915\u0947 \u0938\u093E\u0925 \u092A\u0915\u0921\u093C\u0940 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964","Capturing:":"\u0915\u0948\u092A\u094D\u091F\u0930\u093F\u0902\u0917:","Other document types":"\u0905\u0928\u094D\u092F \u0926\u0938\u094D\u0924\u093E\u0935\u0947\u091C\u093C \u092A\u094D\u0930\u0915\u093E\u0930",Language:"\u092D\u093E\u0937\u093E","More options: app type, accessibility":"\u0905\u0927\u093F\u0915 \u0935\u093F\u0915\u0932\u094D\u092A: \u0910\u092A \u092A\u094D\u0930\u0915\u093E\u0930, \u0905\u092D\u093F\u0917\u092E\u094D\u092F\u0924\u093E","Device / Output experience":"\u0921\u093F\u0935\u093E\u0907\u0938 / \u0906\u0909\u091F\u092A\u0941\u091F \u0905\u0928\u0941\u092D\u0935",Accessibility:"\u0905\u092D\u093F\u0917\u092E\u094D\u092F\u0924\u093E","Start capturing \u2192":"\u0915\u0948\u092A\u094D\u091A\u0930 \u0915\u0930\u0928\u093E \u0936\u0941\u0930\u0942 \u0915\u0930\u0947\u0902 \u2192","Play the 2-minute narrated demo":"2 \u092E\u093F\u0928\u091F \u0915\u093E \u0935\u0930\u094D\u0923\u0928 \u0935\u093E\u0932\u093E \u0921\u0947\u092E\u094B \u091A\u0932\u093E\u090F\u0902","Speak in":"\u092C\u094B\u0932\u093F\u090F","Describe the app or process you need, in your own words. If several people talk, pick who is speaking first, so every requirement carries a name and a voice.":"\u0905\u092A\u0928\u0940 \u092D\u093E\u0937\u093E \u092E\u0947\u0902 \u0909\u0938 \u0910\u092A \u092F\u093E \u092A\u094D\u0930\u0915\u094D\u0930\u093F\u092F\u093E \u0915\u093E \u0935\u0930\u094D\u0923\u0928 \u0915\u0930\u0947\u0902 \u091C\u093F\u0938\u0915\u0940 \u0906\u092A\u0915\u094B \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E \u0939\u0948\u0964 \u092F\u0926\u093F \u0915\u0908 \u0932\u094B\u0917 \u092C\u093E\u0924 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u0924\u094B \u091A\u0941\u0928\u0947\u0902 \u0915\u093F \u092A\u0939\u0932\u0947 \u0915\u094C\u0928 \u092C\u094B\u0932 \u0930\u0939\u0940 \u0939\u0948, \u0924\u093E\u0915\u093F \u0939\u0930 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E \u0915\u093E \u090F\u0915 \u0928\u093E\u092E \u0914\u0930 \u090F\u0915 \u0906\u0935\u093E\u091C\u093C \u0939\u094B\u0964","Who is speaking?":"\u0915\u094C\u0928 \u092C\u094B\u0932 \u0930\u0939\u0940 \u0939\u0948?","Add speaker (e.g. Manager)":"\u0935\u0915\u094D\u0924\u093E \u091C\u094B\u0921\u093C\u0947\u0902 (\u0909\u0926\u093E\u0939\u0930\u0923 \u0915\u0947 \u0932\u093F\u090F, \u092A\u094D\u0930\u092C\u0902\u0927\u0915)",Add:"\u091C\u094B\u0921\u093C\u0947\u0902","Typed in Roman script?":"\u0915\u094D\u092F\u093E \u092F\u0939 \u0930\u094B\u092E\u0928 \u0932\u093F\u092A\u093F \u092E\u0947\u0902 \u091F\u093E\u0907\u092A \u0915\u093F\u092F\u093E \u0917\u092F\u093E \u0939\u0948?","Convert to native script (Sarvam)":"\u092E\u0942\u0932 \u0932\u093F\u092A\u093F \u092E\u0947\u0902 \u092C\u0926\u0932\u0947\u0902 (\u0938\u0930\u094D\u0935\u092E\u094D)","Voices named in the order they were heard. Wrong? Rename:":"\u0906\u0935\u093E\u091C\u093C\u0947\u0902 \u0909\u0938\u0940 \u0915\u094D\u0930\u092E \u092E\u0947\u0902 \u0928\u093E\u092E\u093F\u0924 \u0915\u0940 \u0917\u0908\u0902 \u091C\u0948\u0938\u0947 \u0935\u0947 \u0938\u0941\u0928\u0940 \u0917\u0908\u0902\u0964 \u0917\u0932\u0924? \u0928\u093E\u092E \u092C\u0926\u0932\u0947\u0902:","Listening to":"\u0938\u0941\u0928\u0928\u093E","tap the button to stop":"\u092C\u0902\u0926 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u092C\u091F\u0928 \u0926\u092C\u093E\u090F\u0901\u0964","Tap the microphone and speak as":"\u092E\u093E\u0907\u0915\u094D\u0930\u094B\u092B\u093C\u094B\u0928 \u092A\u0930 \u091F\u0948\u092A \u0915\u0930\u0947\u0902 \u0914\u0930 \u092C\u094B\u0932\u0947\u0902","Sarvam Saaras is transcribing\u2026":"\u0938\u0930\u094D\u0935\u092E \u0938\u093E\u0930\u0938 \u091F\u094D\u0930\u093E\u0902\u0938\u0915\u094D\u0930\u093E\u0907\u092C \u0915\u0930 \u0930\u0939\u0940 \u0939\u0948...","Numbers, names and exceptions are kept exactly as spoken. Every segment is hashed and kept as evidence.":"\u0938\u0902\u0916\u094D\u092F\u093E\u090F\u0901, \u0928\u093E\u092E \u0914\u0930 \u0905\u092A\u0935\u093E\u0926 \u0920\u0940\u0915 \u0935\u0948\u0938\u0947 \u0939\u0940 \u0930\u0916\u0947 \u091C\u093E\u0924\u0947 \u0939\u0948\u0902 \u091C\u0948\u0938\u0947 \u092C\u094B\u0932\u0947 \u0917\u090F \u0925\u0947\u0964 \u0939\u0930 \u0916\u0902\u0921 \u0915\u094B \u0939\u0948\u0936 \u0915\u0930\u0915\u0947 \u0938\u092C\u0942\u0924 \u0915\u0947 \u0924\u094C\u0930 \u092A\u0930 \u0930\u0916\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964","Edit the words":"\u0936\u092C\u094D\u0926\u094B\u0902 \u0915\u094B \u0938\u0902\u092A\u093E\u0926\u093F\u0924 \u0915\u0930\u0947\u0902","Type or paste the words instead":"\u0936\u092C\u094D\u0926\u094B\u0902 \u0915\u094B \u091F\u093E\u0907\u092A \u0915\u0930\u0947\u0902 \u092F\u093E \u092A\u0947\u0938\u094D\u091F \u0915\u0930\u0947\u0902",Transcript:"\u0905\u0928\u0941\u0935\u093E\u0926:","Type or paste the speaker's words, or paste a WhatsApp chat export. Start a line with [Name] to mark who said it.":"\u0935\u0915\u094D\u0924\u093E \u0915\u0947 \u0936\u092C\u094D\u0926\u094B\u0902 \u0915\u094B \u091F\u093E\u0907\u092A \u092F\u093E \u092A\u0947\u0938\u094D\u091F \u0915\u0930\u0947\u0902, \u092F\u093E \u090F\u0915 \u0935\u094D\u0939\u093E\u091F\u094D\u0938\u090F\u092A \u091A\u0948\u091F \u090F\u0915\u094D\u0938\u092A\u094B\u0930\u094D\u091F \u092A\u0947\u0938\u094D\u091F \u0915\u0930\u0947\u0902\u0964 \u092F\u0939 \u091A\u093F\u0939\u094D\u0928\u093F\u0924 \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0915\u093F \u0915\u093F\u0938\u0928\u0947 \u0915\u0939\u093E, [\u0928\u093E\u092E] \u0938\u0947 \u090F\u0915 \u092A\u0902\u0915\u094D\u0924\u093F \u0936\u0941\u0930\u0942 \u0915\u0930\u0947\u0902\u0964","More ways to add words: a recording, a photo of notes, sample text":"\u0936\u092C\u094D\u0926 \u091C\u094B\u0921\u093C\u0928\u0947 \u0915\u0947 \u0914\u0930 \u0924\u0930\u0940\u0915\u0947: \u090F\u0915 \u0930\u093F\u0915\u0949\u0930\u094D\u0921\u093F\u0902\u0917, \u0928\u094B\u091F\u094D\u0938 \u0915\u0940 \u090F\u0915 \u0924\u0938\u094D\u0935\u0940\u0930, \u0928\u092E\u0942\u0928\u093E \u092A\u093E\u0920","Add another recording":"\u090F\u0915 \u0914\u0930 \u0930\u093F\u0915\u0949\u0930\u094D\u0921\u093F\u0902\u0917 \u091C\u094B\u0921\u093C\u0947\u0902","Upload a recorded meeting":"\u0930\u093F\u0915\u0949\u0930\u094D\u0921 \u0915\u0940 \u0917\u0908 \u092E\u0940\u091F\u093F\u0902\u0917 \u0905\u092A\u0932\u094B\u0921 \u0915\u0930\u0947\u0902","Photo or PDF of notes":"\u0928\u094B\u091F\u094D\u0938 \u0915\u0940 \u092B\u094B\u091F\u094B \u092F\u093E \u092A\u0940\u0921\u0940\u090F\u092B","Use demo":"\u0921\u0947\u092E\u094B \u0915\u093E \u0909\u092A\u092F\u094B\u0917 \u0915\u0930\u0947\u0902","Enter rules manually":"\u0928\u093F\u092F\u092E\u094B\u0902 \u0915\u094B \u092E\u0948\u0928\u094D\u092F\u0941\u0905\u0932 \u0930\u0942\u092A \u0938\u0947 \u0926\u0930\u094D\u091C \u0915\u0930\u0947\u0902","Sarvam separates the speakers in a recording and reads handwritten notes.":"\u0938\u0930\u094D\u092C\u092E \u090F\u0915 \u0930\u093F\u0915\u0949\u0930\u094D\u0921\u093F\u0902\u0917 \u092E\u0947\u0902 \u0935\u0915\u094D\u0924\u093E\u0913\u0902 \u0915\u094B \u0905\u0932\u0917 \u0915\u0930\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0939\u0938\u094D\u0924\u0932\u093F\u0916\u093F\u0924 \u0928\u094B\u091F\u094D\u0938 \u092A\u0922\u093C\u0924\u0940 \u0939\u0948\u0964","Use 2-speaker meeting demo":"2-\u0938\u094D\u092A\u0940\u0915\u0930 \u092E\u0940\u091F\u093F\u0902\u0917 \u0921\u0947\u092E\u094B \u0915\u093E \u0909\u092A\u092F\u094B\u0917 \u0915\u0930\u0947\u0902","Next: agent checks for gaps \u2192":"\u0905\u0917\u0932\u093E: \u090F\u091C\u0947\u0902\u091F \u0915\u092E\u093F\u092F\u094B\u0902 \u0915\u0940 \u091C\u093E\u0901\u091A \u0915\u0930\u0924\u093E \u0939\u0948 \u2192","Sample transcript selected. The voices are synthesised by Sarvam Bulbul.":"\u0928\u092E\u0942\u0928\u093E \u092A\u094D\u0930\u0924\u093F\u0932\u093F\u092A\u093F \u0915\u093E \u091A\u092F\u0928 \u0915\u093F\u092F\u093E \u0917\u092F\u093E\u0964 \u0906\u0935\u093E\u091C\u093C\u0947\u0902 \u0938\u0930\u094D\u0935\u092E \u092C\u0941\u0932\u092C\u0941\u0932 \u0926\u094D\u0935\u093E\u0930\u093E \u0938\u0902\u0936\u094D\u0932\u0947\u0937\u093F\u0924 \u0915\u0940 \u0917\u0908 \u0939\u0948\u0902\u0964","The agent's questions":"\u090F\u091C\u0947\u0902\u091F \u0915\u0947 \u0938\u0935\u093E\u0932","A complete BRD needs 8 things. The agent shows what was already said (with the exact words) and asks only for what is missing.":"\u090F\u0915 \u092A\u0942\u0930\u094D\u0923 \u092C\u0940\u0906\u0930\u0921\u0940 \u0915\u094B 8 \u091A\u0940\u091C\u094B\u0902 \u0915\u0940 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E \u0939\u094B\u0924\u0940 \u0939\u0948\u0964 \u090F\u091C\u0947\u0902\u091F \u0926\u093F\u0916\u093E\u0924\u093E \u0939\u0948 \u0915\u093F \u092A\u0939\u0932\u0947 \u0915\u094D\u092F\u093E \u0915\u0939\u093E \u0917\u092F\u093E \u0925\u093E (\u092C\u093F\u0932\u094D\u0915\u0941\u0932 \u0909\u0928\u094D\u0939\u0940\u0902 \u0936\u092C\u094D\u0926\u094B\u0902 \u0915\u0947 \u0938\u093E\u0925) \u0914\u0930 \u0915\u0947\u0935\u0932 \u0935\u0939\u0940 \u092E\u093E\u0902\u0917\u0924\u093E \u0939\u0948 \u091C\u094B \u0917\u093E\u092F\u092C \u0939\u0948\u0964","Review extracted requirements":"\u0938\u092E\u0940\u0915\u094D\u0937\u093E \u0938\u0947 \u0928\u093F\u0915\u093E\u0932\u0940 \u0917\u0908 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E\u090F\u0901","Each requirement must quote the speaker exactly. Fix or remove anything the verifier flags.":"\u092A\u094D\u0930\u0924\u094D\u092F\u0947\u0915 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E \u0915\u094B \u0935\u0915\u094D\u0924\u093E \u0915\u094B \u0920\u0940\u0915 \u0938\u0947 \u0909\u0926\u094D\u0927\u0943\u0924 \u0915\u0930\u0928\u093E \u091A\u093E\u0939\u093F\u090F\u0964 \u0938\u0924\u094D\u092F\u093E\u092A\u0928\u0915\u0930\u094D\u0924\u093E \u091C\u094B \u092D\u0940 \u091A\u093F\u0939\u094D\u0928\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948 \u0909\u0938\u0947 \u0920\u0940\u0915 \u0915\u0930\u0947\u0902 \u092F\u093E \u0939\u091F\u093E \u0926\u0947\u0902\u0964","Review notes":"\u0938\u092E\u0940\u0915\u094D\u0937\u093E \u0928\u094B\u091F\u094D\u0938","Fix this":"\u0907\u0938\u0947 \u0920\u0940\u0915 \u0915\u0930\u0947\u0902\u0964","Not needed":"\u0906\u0935\u0936\u094D\u092F\u0915 \u0928\u0939\u0940\u0902",Approve:"\u092E\u0902\u091C\u093C\u0942\u0930 \u0915\u0930\u0947\u0902","Everything the verifier fully checked is approved in one step. Only flagged requirements (numbers to confirm, vague words, a disagreement) are reviewed one by one. The BRD and the app start building right away.":"\u0938\u0924\u094D\u092F\u093E\u092A\u0928\u0915\u0930\u094D\u0924\u093E \u0928\u0947 \u091C\u094B \u0915\u0941\u091B \u092D\u0940 \u092A\u0942\u0930\u0940 \u0924\u0930\u0939 \u0938\u0947 \u091C\u093E\u0902\u091A\u093E \u0939\u0948, \u0935\u0939 \u090F\u0915 \u0939\u0940 \u091A\u0930\u0923 \u092E\u0947\u0902 \u0938\u094D\u0935\u0940\u0915\u0943\u0924 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964 \u0915\u0947\u0935\u0932 \u091A\u093F\u0939\u094D\u0928\u093F\u0924 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E\u0913\u0902 (\u092A\u0941\u0937\u094D\u091F\u093F \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0938\u0902\u0916\u094D\u092F\u093E\u090F\u0901, \u0905\u0938\u094D\u092A\u0937\u094D\u091F \u0936\u092C\u094D\u0926, \u090F\u0915 \u0905\u0938\u0939\u092E\u0924\u093F) \u0915\u0940 \u090F\u0915-\u090F\u0915 \u0915\u0930\u0915\u0947 \u0938\u092E\u0940\u0915\u094D\u0937\u093E \u0915\u0940 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u092C\u0940\u0906\u0930\u0921\u0940 \u0914\u0930 \u0910\u092A \u0924\u0941\u0930\u0902\u0924 \u092C\u0928\u0928\u093E \u0936\u0941\u0930\u0942 \u0939\u094B \u091C\u093E\u0924\u0947 \u0939\u0948\u0902\u0964","Reviewer name":"\u0938\u092E\u0940\u0915\u094D\u0937\u0915 \u0915\u093E \u0928\u093E\u092E",verified:"\u0938\u0924\u094D\u092F\u093E\u092A\u093F\u0924",review:"\u0938\u092E\u0940\u0915\u094D\u0937\u093E",flagged:"\u091A\u093F\u0939\u094D\u0928\u093F\u0924","More: review one by one, edit everything, add a requirement, show the verifier catching a lie":"\u0914\u0930: \u090F\u0915-\u090F\u0915 \u0915\u0930\u0915\u0947 \u0938\u092E\u0940\u0915\u094D\u0937\u093E \u0915\u0930\u0947\u0902, \u0938\u092C \u0915\u0941\u091B \u0938\u0902\u092A\u093E\u0926\u093F\u0924 \u0915\u0930\u0947\u0902, \u090F\u0915 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E \u091C\u094B\u0921\u093C\u0947\u0902, \u0938\u0924\u094D\u092F\u093E\u092A\u0928\u0915\u0930\u094D\u0924\u093E \u0915\u094B \u091D\u0942\u0920 \u092A\u0915\u0921\u093C\u0924\u0947 \u0939\u0941\u090F \u0926\u093F\u0916\u093E\u090F\u0901\u0964","Owner view":"\u092E\u093E\u0932\u093F\u0915 \u0915\u093E \u0926\u0943\u0937\u094D\u091F\u093F\u0915\u094B\u0923","Vendor view (edit everything)":"\u0935\u093F\u0915\u094D\u ":"\u0926\u094D\u0935\u093E\u0930\u093E \u0924\u0948\u092F\u093E\u0930 \u0915\u093F\u092F\u093E \u0917\u092F\u093E","numbers to confirm":"\u092A\u0941\u0937\u094D\u091F\u093F \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0928\u0902\u092C\u0930",problems:"\u0938\u092E\u0938\u094D\u092F\u093E\u090F\u0901","AI claims blocked":"\u090F\u0906\u0908 \u0915\u0947 \u0926\u093E\u0935\u0947 \u0905\u0935\u0930\u0941\u0926\u094D\u0927 \u0915\u0930 \u0926\u093F\u090F \u0917\u090F\u0964","vague terms to clarify":"\u0938\u094D\u092A\u0937\u094D\u091F \u0915\u0930\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0905\u0938\u094D\u092A\u0937\u094D\u091F \u0936\u092C\u094D\u0926",Start:"\u0936\u0941\u0930\u0942",Speak:"\u092C\u094B\u0932\u0947\u0902","Agent questions":"\u090F\u091C\u0947\u0902\u091F \u0915\u0947 \u0938\u0935\u093E\u0932",Review:"\u0938\u092E\u0940\u0915\u094D\u0937\u093E","BRD + App":"BRD + \u0910\u092A","Goal / problem":"\u0932\u0915\u094D\u0937\u094D\u092F / \u0938\u092E\u0938\u094D\u092F\u093E","Users and stakeholders":"\u0909\u092A\u092F\u094B\u0917\u0915\u0930\u094D\u0924\u093E \u0914\u0930 \u0939\u093F\u0924\u0927\u093E\u0930\u0915","Key features":"\u092E\u0941\u0916\u094D\u092F \u092B\u093C\u0940\u091A\u0930",Timeline:"\u0938\u092E\u092F-\u0938\u0940\u092E\u093E",Budget:"\u092C\u091C\u091F","Success measure":"\u0938\u092B\u0932\u0924\u093E \u0915\u093E \u092A\u0948\u092E\u093E\u0928\u093E",Constraints:"\u0938\u0940\u092E\u093E\u090F\u0901","Sign-off owner":"\u092E\u0902\u091C\u093C\u0942\u0930\u0940 \u0926\u0947\u0928\u0947 \u0935\u093E\u0932\u093E",missing:"\u092C\u093E\u0915\u093C\u0940",answered:"\u091C\u0935\u093E\u092C \u092E\u093F\u0932\u093E",skipped:"\u091B\u094B\u0921\u093C\u093E \u0917\u092F\u093E","already said":"\u092A\u0939\u0932\u0947 \u0939\u0940 \u0915\u0939\u093E \u0917\u092F\u093E",agent:"\u090F\u091C\u0947\u0902\u091F",extraction:"\u0930\u093F\u0915\u094D\u0935\u093E\u092F\u0930\u092E\u0947\u0902\u091F \u0928\u093F\u0915\u093E\u0932\u0928\u093E","BRD draft":"BRD \u0921\u094D\u0930\u093E\u092B\u093C\u094D\u091F",app:"\u0910\u092A","Stakeholders disagree":"\u0939\u093F\u0924\u0927\u093E\u0930\u0915 \u0905\u0938\u0939\u092E\u0924 \u0939\u0948\u0902","Ask the agent to reconcile both":"\u090F\u091C\u0947\u0902\u091F \u0938\u0947 \u0926\u094B\u0928\u094B\u0902 \u0915\u094B \u092E\u093F\u0932\u093E\u0928\u0947 \u0915\u094B \u0915\u0939\u0947\u0902","The agent is reconciling\u2026":"\u090F\u091C\u0947\u0902\u091F \u0938\u0941\u0932\u0939 \u0915\u0930 \u0930\u0939\u093E \u0939\u0948\u2026","The agent proposes one rule for both":"\u090F\u091C\u0947\u0902\u091F \u0926\u094B\u0928\u094B\u0902 \u0915\u0947 \u0932\u093F\u090F \u090F\u0915 \u0928\u093F\u092F\u092E \u0938\u0941\u091D\u093E\u0924\u093E \u0939\u0948","Ask the owner":"\u092E\u093E\u0932\u093F\u0915 \u0938\u0947 \u092A\u0942\u091B\u0947\u0902","Use the reconciled rule":"\u092E\u093F\u0932\u093E\u092F\u093E \u0939\u0941\u0906 \u0928\u093F\u092F\u092E \u0905\u092A\u0928\u093E\u090F\u0901","Executable requirements":"\u091A\u0932\u093E\u0915\u0930 \u0926\u0947\u0916\u0928\u0947 \u092F\u094B\u0917\u094D\u092F \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E\u090F\u0901","Try a scenario before anything is built":"\u0915\u0941\u091B \u092C\u0928\u0928\u0947 \u0938\u0947 \u092A\u0939\u0932\u0947 \u090F\u0915 \u0938\u094D\u0925\u093F\u0924\u093F \u0906\u091C\u093C\u092E\u093E\u090F\u0901","Describe a situation in your own words. VAANI shows which requirements would fire, so a disagreement like 50 kg versus 100 kg has a visible consequence.":"\u0905\u092A\u0928\u0947 \u0936\u092C\u094D\u0926\u094B\u0902 \u092E\u0947\u0902 \u090F\u0915 \u0938\u094D\u0925\u093F\u0924\u093F \u092C\u0924\u093E\u0907\u090F\u0964 VAANI \u0926\u093F\u0916\u093E\u0924\u093E \u0939\u0948 \u0915\u093F \u0915\u094C\u0928-\u0938\u0940 \u0906\u0935\u0936\u094D\u092F\u0915\u0924\u093E\u090F\u0901 \u0932\u093E\u0917\u0942 \u0939\u094B\u0902\u0917\u0940, \u0924\u093E\u0915\u093F 50 \u0915 y when":"\u0915\u094D\u092F\u093E \u0935\u093E\u0926\u093E \u0939\u0941\u0906, \u0915\u092C \u0924\u0915","Inferred from the words, each with its quote. A date nothing supports is marked to confirm, never invented.":"\u092C\u093E\u0924\u094B\u0902 \u0938\u0947 \u0928\u093F\u0915\u093E\u0932\u0940 \u0917\u0908, \u0939\u0930 \u090F\u0915 \u0915\u0947 \u0938\u093E\u0925 \u0909\u0938\u0915\u093E \u0909\u0926\u094D\u0927\u0930\u0923\u0964 \u091C\u093F\u0938 \u0924\u093E\u0930\u0940\u0916\u093C \u0915\u093E \u0915\u094B\u0908 \u0906\u0927\u093E\u0930 \u0928\u0939\u0940\u0902, \u0935\u0939 \u092A\u0941\u0937\u094D\u091F\u093F \u0915\u0947 \u0932\u093F\u090F \u091A\u093F\u0939\u094D\u0928\u093F\u0924 \u0939\u0948, \u0915\u092D\u0940 \u0917\u0922\u093C\u0940 \u0928\u0939\u0940\u0902 \u091C\u093E\u0924\u0940\u0964","Calendar file (.ics)":"\u0915\u0948\u0932\u0947\u0902\u0921\u0930 \u092B\u093C\u093E\u0907\u0932 (.ics)","Reading the dates out of what was said\u2026":"\u0915\u0939\u0940 \u0917\u0908 \u092C\u093E\u0924\u094B\u0902 \u0938\u0947 \u0924\u093E\u0930\u0940\u0916\u093C\u0947\u0902 \u0928\u093F\u0915\u093E\u0932\u0940 \u091C\u093E \u0930\u0939\u0940 \u0939\u0948\u0902\u2026","No dated commitment was spoken. Ask the owner for a launch date and it will appear here.":"\u0915\u094B\u0908 \u0924\u093E\u0930\u0940\u0916\u093C \u0935\u093E\u0932\u093E \u0935\u093E\u0926\u093E \u0928\u0939\u0940\u0902 \u0915\u0939\u093E \u0917\u092F\u093E\u0964 \u092E\u093E\u0932\u093F\u0915 \u0938\u0947 \u0932\u0949\u0928\u094D\u091A \u0915\u0940 \u0924\u093E\u0930\u0940\u0916\u093C \u092A\u0942\u091B\u0947\u0902, \u0935\u0939 \u092F\u0939\u093E\u0901 \u0926\u093F\u0916\u0947\u0917\u0940\u0964","date to confirm":"\u0924\u093E\u0930\u0940\u0916\u093C \u092A\u0941\u0937\u094D\u091F\u093F \u0915\u0930\u0947\u0902","Add to Google Calendar":"Google Calendar \u092E\u0947\u0902 \u091C\u094B\u0921\u093C\u0947\u0902","Google account":"Google \u0916\u093E\u0924\u093E","Connect Google":"Google \u091C\u0 C1 \u0C95\u0CC8\u0CAF\u0CBE\u0CB0\u0CC6 \u0CA8\u0CAE\u0CC2\u0CA6\u0CBF\u0CB8\u0CBF","Sarvam separates the speakers in a recording and reads handwritten notes.":"\u0CB8\u0CB0\u0CCD\u0CB5\u0CAE\u0CCD \u0CA7\u0CCD\u0CB5\u0CA8\u0CBF\u0CAE\u0CC1\u0CA6\u0CCD\u0CB0\u0CA3\u0CA6\u0CB2\u0CCD\u0CB2\u0CBF\u0CB0\u0CC1\u0CB5 \u0CAE\u0CBE\u0CA4\u0CA8\u0CBE\u0CA1\u0CC1\u0CB5\u0CB5\u0CB0\u0CA8\u0CCD\u0CA8\u0CC1 \u0CAC\u0CC7\u0CB0\u0CCD\u0CAA\u0CA1\u0CBF\u0CB8\u0CC1\u0CA4\u0CCD\u0CA4\u0CBE\u0CB3\u0CC6 \u0CAE\u0CA4\u0CCD\u0CA4\u0CC1 \u0C95\u0CC8\u0CAC\u0CB0\u0CB9\u0CA6 \u0C9F\u0CBF\u0CAA\u0CCD\u0CAA\u0CA3\u0CBF\u0C97\u0CB3\u0CA8\u0CCD\u0CA8\u0CC1 \u0C93\u0CA6\u0CC1\u0CA4\u0CCD\u0CA4\u0CBE\u0CB3\u0CC6.","Use 2-speaker meeting demo":"2-\u0CB8\u0CCD\u0CAA\u0CC0\u0C95\u0CB0\u0CCD \u0CB8\u0CAD\u0CC6\u0CAF \u0CA1\u0CC6\u0CAE\u0CCA\u0CB5\u0CA8\u0CCD\u0CA8\u0CC1 \u0CAC\u0CB3\u0CB8\u0CBF","Next: agent checks for gaps \u2192":"\u0CAE\u0CC1\u0C82\u0CA6\u0CC6: \u0C8F\u0C9C\u0CC6\u0C82\u0C9F\u0CCD \u0CA8\u0CCD\u0CAF\u0CC2\u0CA8\u0CA4\u0CC6\u0C97\u0CB3\u0CBF\u0C97\u0CBE\u0C97\u0CBF \u0CAA\u0CB0\u0CBF\u0CB6\u0CC0\u0CB2\u0CBF\u0CB8\u0CC1\u0CA4\u0CCD\u0CA4\u0CBE\u0CB3\u0CC6 \u2192","Sample transcript selected. The voices are synthesised by Sarvam Bulbul.":"\u0CAE\u0CBE\u0CA6\u0CB0\u0CBF \u0CB2\u0CBF\u0CAA\u0CBF\u0CAF\u0CA8\u0CCD\u0CA8\u0CC1 \u0C86\u0CAF\u0CCD\u0C95\u0CC6 \u0CAE\u0CBE\u0CA1\u0CB2\u0CBE\u0C97\u0CBF\u0CA6\u0CC6. \u0CA7\u0CCD\u0CB5\u0CA8\u0CBF\u0C97\u0CB3\u0CA8\u0CCD\u0CA8\u0CC1 \u0CB8\u0CB0\u0CCD\u0CB5\u0CAE\u0CCD \u0CAC\u0CC1\u0CB2\u0CCD\u0CAC\u0CC1\u0CB2\u0CCD \u0CB8\u0C82\u0CB6\u0CCD\u0CB2\u0CC7\u0CB7\u0CBF\u0CB8\u0CBF\u0CA6\u0CCD\u0CA6\u0CBE\u0CB0\u0CC6.","The agent's questions":"\u0C8F\u0C9C\u0CC6\u0C82\u0C9F\u0CA8 \u0CAA\u0CCD\u0CB0\u0CB6\u0CCD\u0CA8\u0CC6\u0C97\u0CB3\u0CC1","A complete BRD needs 8 things. The agent shows what was already said (with the exact words) and asks only for what is missing.":"\u0CB8\u0C82\u0CAA\u0CC2\u0CB0\u0CCD\u0CA3 BRD \u0C97\u0CC6 8 \u0CB5\u0CBF\u0CB7 ep. Only flagged requirements (numbers to confirm, vague words, a disagreement) are reviewed one by one. The BRD and the app start building right away.":"\u0CAA\u0CB0\u0CBF\u0CB6\u0CC0\u0CB2\u0C95\u0CBF\u0CAF\u0CC1 \u0CB8\u0C82\u0CAA\u0CC2\u0CB0\u0CCD\u0CA3\u0CB5\u0CBE\u0C97\u0CBF \u0CAA\u0CB0\u0CBF\u0CB6\u0CC0\u0CB2\u0CBF\u0CB8\u0CBF\u0CA6 \u0C8E\u0CB2\u0CCD\u0CB2\u0CB5\u0CA8\u0CCD\u0CA8\u0CC2 \u0C92\u0C82\u0CA6\u0CC7 \u0CB9\u0C82\u0CA4\u0CA6\u0CB2\u0CCD\u0CB2\u0CBF \u0C85\u0CA8\u0CC1\u0CAE\u0CCB\u0CA6\u0CBF\u0CB8\u0CB2\u0CBE\u0C97\u0CC1\u0CA4\u0CCD\u0CA4\u0CA6\u0CC6. \u0C97\u0CC1\u0CB0\u0CC1\u0CA4\u0CBF\u0CB8\u0CB2\u0CBE\u0CA6 \u0C85\u0C97\u0CA4\u0CCD\u0CAF\u0CA4\u0CC6\u0C97\u0CB3\u0CA8\u0CCD\u0CA8\u0CC1 \u0CAE\u0CBE\u0CA4\u0CCD\u0CB0 (\u0C96\u0C9A\u0CBF\u0CA4\u0CAA\u0CA1\u0CBF\u0CB8\u0CB2\u0CC1 \u0CB8\u0C82\u0C96\u0CCD\u0CAF\u0CC6\u0C97\u0CB3\u0CC1, \u0C85\u0CB8\u0CCD\u0CAA\u0CB7\u0CCD\u0C9F \u0CAA\u0CA6\u0C97\u0CB3\u0CC1, \u0CAD\u0CBF\u0CA8\u0CCD\u0CA8\u0CBE\u0CAD\u0CBF\u0CAA\u0CCD\u0CB0\u0CBE\u0CAF) \u0C92\u0C82\u0CA6\u0CCA\u0C82\u0CA6\u0CBE\u0C97\u0CBF \u0CAA\u0CB0\u0CBF\u0CB6\u0CC0\u0CB2\u0CBF\u0CB8\u0CB2\u0CBE\u0C97\u0CC1\u0CA4\u0CCD\u0CA4\u0CA6\u0CC6. BRD \u0CAE\u0CA4\u0CCD\u0CA4\u0CC1 \u0C85\u0CAA\u0CCD\u0CB2\u0CBF\u0C95\u0CC7\u0CB6\u0CA8\u0CCD \u0CA4\u0C95\u0CCD\u0CB7\u0CA3\u0CB5\u0CC7 \u0CA8\u0CBF\u0CB0\u0CCD\u0CAE\u0CBE\u0CA3\u0CB5\u0CBE\u0C97\u0CB2\u0CC1 \u0CAA\u0CCD\u0CB0\u0CBE\u0CB0\u0C82\u0CAD\u0CBF\u0CB8\u0CC1\u0CA4\u0CCD\u0CA4\u0CB5\u0CC6.","Reviewer name":"\u0CB5\u0CBF\u0CAE\u0CB0\u0CCD\u0CB6\u0C95\u0CB3 \u0CB9\u0CC6\u0CB8\u0CB0\u0CC1",verified:"\u0C96\u0C9A\u0CBF\u0CA4\u0CAA\u0CA1\u0CBF\u0CB8\u0CB2\u0CBE\u0C97\u0CBF\u0CA6\u0CC6",review:"\u0CAA\u0CB0\u0CBF\u0CB6\u0CC0\u0CB2\u0CA8\u0CC6",flagged:"\u0C97\u0CC1\u0CB0\u0CC1\u0CA4\u0CBF\u0CB8\u0CB2\u0CBE\u0C97\u0CBF\u0CA6\u0CC6","More: review one by one, edit everything, add a requirement, show the verifier catching a lie":"\u0C87\u0CA8\u0CCD\u0CA8\u0CB7\u0CCD\u0C9F\u0CC1: \u0C92\u0C82\u0CA6\u0CCA\u0C BCD\u0BB1\u0BB5\u0BC1\u0BAE\u0BCD.","Voices named in the order they were heard. Wrong? Rename:":"\u0B95\u0BC7\u0B9F\u0BCD\u0B95\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F \u0BB5\u0BB0\u0BBF\u0B9A\u0BC8\u0BAF\u0BBF\u0BB2\u0BCD \u0BAA\u0BC6\u0BAF\u0BB0\u0BBF\u0B9F\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F \u0B95\u0BC1\u0BB0\u0BB2\u0BCD\u0B95\u0BB3\u0BCD. \u0BA4\u0BB5\u0BB1\u0BBE? \u0BAA\u0BC6\u0BAF\u0BB0\u0BCD \u0BAE\u0BBE\u0BB1\u0BCD\u0BB1\u0BB5\u0BC1\u0BAE\u0BCD:","Listening to":"\u0B95\u0BC7\u0B9F\u0BCD\u0B9F\u0BC1\u0B95\u0BCD\u0B95\u0BCA\u0BA3\u0BCD\u0B9F\u0BBF\u0BB0\u0BC1\u0B95\u0BCD\u0B95\u0BBF\u0BB1\u0BC7\u0BA9\u0BCD","tap the button to stop":"\u0BA8\u0BBF\u0BB1\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1\u0BB5\u0BA4\u0BB1\u0BCD\u0B95\u0BC1 \u0BAA\u0BCA\u0BA4\u0BCD\u0BA4\u0BBE\u0BA9\u0BC8 \u0BA4\u0B9F\u0BCD\u0B9F\u0BB5\u0BC1\u0BAE\u0BCD.","Tap the microphone and speak as":"\u0B92\u0BB2\u0BBF\u0BB5\u0BBE\u0B99\u0BCD\u0B95\u0BBF\u0BAF\u0BC8\u0BA4\u0BCD \u0BA4\u0B9F\u0BCD\u0B9F\u0BBF\u0BAA\u0BCD \u0BAA\u0BC7\u0B9A\u0BC1\u0B99\u0BCD\u0B95\u0BB3\u0BCD.","Sarvam Saaras is transcribing\u2026":"\u0B9A\u0BB0\u0BCD\u0BB5\u0BAE\u0BCD \u0B9A\u0BBE\u0BB0\u0BB8\u0BCD \u0BAA\u0B9F\u0BBF\u0BAF\u0BC1\u0B99\u0BCD\u0B95\u0BB3\u0BCD...","Numbers, names and exceptions are kept exactly as spoken. Every segment is hashed and kept as evidence.":"\u0B8E\u0BA3\u0BCD\u0B95\u0BB3\u0BCD, \u0BAA\u0BC6\u0BAF\u0BB0\u0BCD\u0B95\u0BB3\u0BCD \u0BAE\u0BB1\u0BCD\u0BB1\u0BC1\u0BAE\u0BCD \u0BB5\u0BBF\u0BA4\u0BBF\u0BB5\u0BBF\u0BB2\u0B95\u0BCD\u0B95\u0BC1\u0B95\u0BB3\u0BCD \u0B85\u0BAA\u0BCD\u0BAA\u0B9F\u0BBF\u0BAF\u0BC7 \u0BAA\u0BC7\u0B9A\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F\u0BAA\u0B9F\u0BBF \u0BB5\u0BC8\u0B95\u0BCD\u0B95\u0BAA\u0BCD\u0BAA\u0B9F\u0BC1\u0B95\u0BBF\u0BA9\u0BCD\u0BB1\u0BA9. \u0B92\u0BB5\u0BCD\u0BB5\u0BCA\u0BB0\u0BC1 \u0BAA\u0B95\u0BC1\u0BA4\u0BBF\u0BAF\u0BC1\u0BAE\u0BCD \u0BB9\u0BBE\u0BB7\u0BCD \u0B9A\u0BC6\u0BAF\u0BCD\u0BAF\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F\u0BC1 \u0B86\u0BA4\u0BBE\u0BB0\u0BAE\u0BBE\u0B95 \u0BB5\u0BC8\u0B95\u0BCD\u0B95\u0BAA\u0BCD\u0BAA\u0B9F\u0BC1\u0B95\u0BBF\u0BB1\u0BA4\u0BC1.","Edit the words":"\u0BB5\u0BBE\u0BB0\u0BCD\u0BA4\u0BCD\u0BA4\u0BC8\u0B95\u0BB3\u0BC8\u0BA4\u0BCD \u0BA4\u0BBF\u0BB0\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1\u0B99\u0BCD\u0B95\u0BB3\u0BCD","Type or paste the words instead":"\u0BB5\u0BBE\u0BB0\u0BCD\u0BA4\u0BCD\u0BA4\u0BC8\u0B95\u0BB3\u0BC8\u0BA4\u0BCD \u0BA4\u0B9F\u0BCD\u0B9F\u0B9A\u0BCD\u0B9A\u0BC1 \u0B9A\u0BC6\u0BAF\u0BCD\u0BA4\u0BC1 \u0B85\u0BB2\u0BCD\u0BB2\u0BA4\u0BC1 \u0B92\u0B9F\u0BCD\u0B9F\u0BBF.",Transcript:"\u0BAA\u0BC6\u0BA3\u0BCD: \u0B9F\u0BBF\u0BB0\u0BBE\u0BA9\u0BCD\u0BB8\u0BCD\u0B95\u0BBF\u0BB0\u0BBF\u0BAA\u0BCD\u0B9F\u0BCD","Type or paste the speaker's words, or paste a WhatsApp chat export. Start a line with [Name] to mark who said it.":"\u0BAA\u0BC7\u0B9A\u0BCD\u0B9A\u0BBE\u0BB3\u0BB0\u0BBF\u0BA9\u0BCD \u0BB5\u0BBE\u0BB0\u0BCD\u0BA4\u0BCD\u0BA4\u0BC8\u0B95\u0BB3\u0BC8 \u0BA4\u0B9F\u0BCD\u0B9F\u0B9A\u0BCD\u0B9A\u0BC1 \u0B9A\u0BC6\u0BAF\u0BCD\u0BA4\u0BC1 \u0B92\u0B9F\u0BCD\u0B9F\u0BB5\u0BC1\u0BAE\u0BCD \u0B85\u0BB2\u0BCD\u0BB2\u0BA4\u0BC1 \u0BB5\u0BBE\u0B9F\u0BCD\u0BB8\u0BCD\u0B85\u0BAA\u0BCD \u0B85\u0BB0\u0B9F\u0BCD\u0B9F\u0BC8 \u0B8F\u0BB1\u0BCD\u0BB1\u0BC1\u0BAE\u0BA4\u0BBF\u0BAF\u0BC8 \u0B92\u0B9F\u0BCD\u0B9F\u0BB5\u0BC1\u0BAE\u0BCD. \u0BAF\u0BBE\u0BB0\u0BCD \u0B9A\u0BCA\u0BA9\u0BCD\u0BA9\u0BBE\u0BB0\u0BCD\u0B95\u0BB3\u0BCD \u0B8E\u0BA9\u0BCD\u0BAA\u0BA4\u0BC8\u0B95\u0BCD \u0B95\u0BC1\u0BB1\u0BBF\u0B95\u0BCD\u0B95 [\u0BAA\u0BC6\u0BAF\u0BB0\u0BCD] \u0B8E\u0BA9\u0BCD\u0BB1\u0BC1 \u0B92\u0BB0\u0BC1 \u0BB5\u0BB0\u0BBF\u0BAF\u0BC8\u0BA4\u0BCD \u0BA4\u0BCA\u0B9F\u0B99\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD.","More ways to add words: a recording, a photo of notes, sample text":"\u0BB5\u0BBE\u0BB0\u0BCD\u0BA4\u0BCD\u0BA4\u0BC8\u0B95\u0BB3\u0BC8\u0B9A\u0BCD \u0B9A\u0BC7\u0BB0\u0BCD\u0B95\u0BCD\u0B95 \u0BAE\u0BC7\u0BB2\u0BC1\u0BAE\u0BCD \u0BB5\u0BB4\u0BBF\u0B95\u0BB3\u0BCD: \u0B92\u0BB0\u0BC1 \u0BAA\u0BA4\u0BBF\u0BB5\u0BC1, \u0B95\u0BC1\u0BB1\u0BBF\u0BAA\u0BCD\u0BAA\u0BC1\u0B95\u0BB3\u0BBF\u0BA9\u0BCD \u0BAA\u0BC1\u0B95\u0BC8\u0BAA\u0BCD\u0BAA\u0B9F\u0BAE\u0BCD, \u0BAE\u0BBE\u0BA4\u0BBF\u0BB0\u0BBF \u0B89\u0BB0\u0BC8.","Add another recording":"\u0B87\u0BA9\u0BCD\u0BA9\u0BCA\u0BB0\u0BC1 \u0BAA\u0BA4\u0BBF\u0BB5\u0BC8\u0B9A\u0BCD \u0B9A\u0BC7\u0BB0\u0BCD\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD","Upload a recorded meeting":"\u0BAA\u0BA4\u0BBF\u0BB5\u0BC1 \u0B9A\u0BC6\u0BAF\u0BCD\u0BAF\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F \u0B95\u0BC2\u0B9F\u0BCD\u0B9F\u0BA4\u0BCD\u0BA4\u0BC8\u0BAA\u0BCD \u0BAA\u0BA4\u0BBF\u0BB5\u0BC7\u0BB1\u0BCD\u0BB1\u0BB5\u0BC1\u0BAE\u0BCD.","Photo or PDF of notes":"\u0B95\u0BC1\u0BB1\u0BBF\u0BAA\u0BCD\u0BAA\u0BC1\u0B95\u0BB3\u0BBF\u0BA9\u0BCD \u0BAA\u0BC1\u0B95\u0BC8\u0BAA\u0BCD\u0BAA\u0B9F\u0BAE\u0BCD \u0B85\u0BB2\u0BCD\u0BB2\u0BA4\u0BC1 PDF","Use demo":"\u0B9F\u0BC6\u0BAE\u0BCB\u0BB5\u0BC8\u0BAA\u0BCD \u0BAA\u0BAF\u0BA9\u0BCD\u0BAA\u0B9F\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1\u0B99\u0BCD\u0B95\u0BB3\u0BCD","Enter rules manually":"\u0BB5\u0BBF\u0BA4\u0BBF\u0BAE\u0BC1\u0BB1\u0BC8\u0B95\u0BB3\u0BC8 \u0B95\u0BC8\u0BAE\u0BC1\u0BB1\u0BC8\u0BAF\u0BBE\u0B95 \u0B89\u0BB3\u0BCD\u0BB3\u0BBF\u0B9F\u0BB5\u0BC1\u0BAE\u0BCD.","Sarvam separates the speakers in a recording and reads handwritten notes.":"\u0B9A\u0BB0\u0BCD\u0BB5\u0BAE\u0BCD \u0B92\u0BB0\u0BC1 \u0BAA\u0BA4\u0BBF\u0BB5\u0BBF\u0BB2\u0BCD \u0B89\u0BB3\u0BCD\u0BB3 \u0BAA\u0BC7\u0B9A\u0BCD\u0B9A\u0BBE\u0BB3\u0BB0\u0BCD\u0B95\u0BB3\u0BC8\u0BAA\u0BCD \u0BAA\u0BBF\u0BB0\u0BBF\u0BA4\u0BCD\u0BA4\u0BC1 \u0B95\u0BC8\u0BAF\u0BBE\u0BB2\u0BCD \u0B8E\u0BB4\u0BC1\u0BA4\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F \u0B95\u0BC1\u0BB1\u0BBF\u0BAA\u0BCD\u0BAA\u0BC1\u0B95\u0BB3\u0BC8\u0BAA\u0BCD \u0BAA\u0B9F\u0BBF\u0B95\u0BCD\u0B95\u0BBF\u0BB1\u0BBE\u0BB0\u0BCD.","Use 2-speaker meeting demo":"2-\u0BAA\u0BC7\u0B9A\u0BCD\u0B9A\u0BBE\u0BB3\u0BB0\u0BCD \u0B9A\u0BA8\u0BCD\u0BA4\u0BBF\u0BAA\u0BCD\u0BAA\u0BC1 \u0B9F\u0BC6\u0BAE\u0BCB\u0BB5\u0BC8\u0BAA\u0BCD \u0BAA\u0BAF\u0BA9\u0BCD\u0BAA\u0B9F\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1\u0B99\u0BCD\u0B95\u0BB3\u0BCD.","Next: agent checks for gaps \u2192":"\u0B85\u0B9F\u0BC1\u0BA4\u0BCD\u0BA4\u0BC1: \u0BAE\u0BC1\u0B95\u0BB5\u0BB0\u0BCD \u0B87\u0B9F\u0BC8\u0BB5\u0BC6\u0BB3\u0BBF\u0B95\u0BB3\u0BC8\u0B9A\u0BCD \u0B9A\u0BB0\u0BBF\u0BAA\u0BBE\u0BB0\u0BCD\u0B95\u0BCD\u0B95\u0BBF\u0BB1\u0BBE\u0BB0\u0BCD \u2192","Sample transcript selected. The voices are synthesised by Sarvam Bulbul.":"\u0BA4\u0BC7\u0BB0\u0BCD\u0BA8\u0BCD\u0BA4\u0BC6\u0B9F\u0BC1\u0B95\u0BCD\u0B95\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F \u0BAE\u0BBE\u0BA4\u0BBF\u0BB0\u0BBF \u0B9F\u0BBF\u0BB0\u0BBE\u0BA9\u0BCD\u0BB8\u0BCD\u0B95\u0BBF\u0BB0\u0BBF\u0BAA\u0BCD\u0B9F\u0BCD. \u0B95\u0BC1\u0BB0\u0BB2\u0BCD\u0B95\u0BB3\u0BCD \u0B9A\u0BB0\u0BCD\u0BB5\u0BAE\u0BCD \u0BAA\u0BC1\u0BB2\u0BCD\u0BAA\u0BC2\u0BB2\u0BBE\u0BB2\u0BCD \u0BA4\u0BCA\u0B95\u0BC1\u0B95\u0BCD\u0B95\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F\u0BC1\u0BB3\u0BCD\u0BB3\u0BA9.","The agent's questions":"\u0BAE\u0BC1\u0B95\u0BB5\u0BB0\u0BBF\u0BA9\u0BCD \u0B95\u0BC7\u0BB3\u0BCD\u0BB5\u0BBF\u0B95\u0BB3\u0BCD","A complete BRD needs 8 things. The agent shows what was already said (with the exact words) and asks only for what is missing.":"\u0B92\u0BB0\u0BC1 \u0BAE\u0BC1\u0BB4\u0BC1\u0BAE\u0BC8\u0BAF\u0BBE\u0BA9 BRD\u0B95\u0BCD\u0B95\u0BC1 8 \u0BB5\u0BBF\u0BB7\u0BAF\u0B99\u0BCD\u0B95\u0BB3\u0BCD \u0BA4\u0BC7\u0BB5\u0BC8. \u0BAE\u0BC1\u0B95\u0BB5\u0BB0\u0BCD \u0B8F\u0BB1\u0BCD\u0B95\u0BA9\u0BB5\u0BC7 \u0B8E\u0BA9\u0BCD\u0BA9 \u0B9A\u0BCA\u0BB2\u0BCD\u0BB2\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F\u0BA4\u0BC1 \u0B8E\u0BA9\u0BCD\u0BAA\u0BA4\u0BC8 (\u0B9A\u0BB0\u0BBF\u0BAF\u0BBE\u0BA9 \u0BB5\u0BBE\u0BB0\u0BCD\u0BA4\u0BCD\u0BA4\u0BC8\u0B95\u0BB3\u0BC1\u0B9F\u0BA9\u0BCD) \u0B95\u0BBE\u0B9F\u0BCD\u0B9F\u0BC1\u0B95\u0BBF\u0BB1\u0BBE\u0BB0\u0BCD, \u0BAE\u0BC7\u0BB2\u0BC1\u0BAE\u0BCD \u0BB5\u0BBF\u0B9F\u0BC1\u0BAA\u0B9F\u0BCD\u0B9F\u0BA4\u0BC8 \u0BAE\u0B9F\u0BCD\u0B9F\u0BC1\u0BAE\u0BCD \u0B95\u0BC7\u0B9F\u0BCD\u0B95\u0BBF\u0BB1\u0BBE\u0BB0\u0BCD.","Review extracted requirements":"\u0BAE\u0BA4\u0BBF\u0BAA\u0BCD\u0BAA\u0BBE\u0BAF\u0BCD\u0BB5\u0BC1 \u0B8E\u0B9F\u0BC1\u0B95\u0BCD\u0B95\u0BAA\u0BCD\u0BAA\u0B9F\u0BCD\u0B9F \u0BA4\u0BC7\u0BB5\u0BC8\u0B95\u0BB3\u0BCD","Each requirement must quote the speaker exactly. Fix or remove anything the verifier flags.":"\u0B92\u0BB5\u0BCD\u0BB5\u0BCA\u0BB0\u0BC1 \u0BA4\u0BC7\u0BB5\u0BC8\u0BAF\u0BC1\u0BAE\u0BCD \u0BAA\u0BC7\u0B9A\u0BCD\u0B9A\u0BBE\u0BB3\u0BB0\u0BC8 \u0B85\u0BAA\u0BCD\u0BAA\u0B9F\u0BBF\u0BAF\u0BC7 \u0BAE\u0BC7\u0BB1\u0BCD\u0B95\u0BCB\u0BB3\u0BCD \u0B95\u0BBE\u0B9F\u0BCD\u0B9F \u0BB5\u0BC7\u0BA3\u0BCD\u0B9F\u0BC1\u0BAE\u0BCD. \u0B9A\u0BB0\u0BBF\u0BAA\u0BBE\u0BB0\u0BCD\u0BAA\u0BCD\u0BAA\u0BB5\u0BB0\u0BCD \u0B9A\u0BC1\u0B9F\u0BCD\u0B9F\u0BBF\u0B95\u0BCD\u0B95\u0BBE\u0B9F\u0BCD\u0B9F\u0BC1\u0BB5\u0BA4\u0BC8 \u0B9A\u0BB0\u0BBF\u0B9A\u0BC6\u0BAF\u0BCD\u0BAF\u0BB5\u0BC1\u0BAE\u0BCD \u0B85\u0BB2\u0BCD\u0BB2\u0BA4\u0BC1 \u0B85\u0B95\u0BB1\u0BCD\u0BB1\u0BB5\u0BC1\u0BAE\u0BCD.","Review notes":"\u0BAE\u0BA4\u0BBF\u0BAA\u0BCD\u0BAA\u0BBE\u0BAF\u0BCD\u0BB5\u0BC1 \u0B95\u0BC1\u0BB1\u0BBF\u0BAA\u0BCD\u0BAA\u0BC1\u0B95\u0BB3\u0BCD","Fix this":"\u0B87\u0BA4\u0BC8\u0B9A\u0BCD \u0B9A\u0BB0\u0BBF \u0B9A\u0BC6\u0BAF\u0BCD\u0BAF\u0BC1\u0B99\u0BCD\u0B95\u0BB3\u0BCD.","Not needed":"\u0BA4\u0BC7\u0BB5\u0BC8\u0BAF\u0BBF\u0BB2\u0BCD\u0BB2\u0BC8",Approve:"\u0B85\u0B99\u0BCD\u0B95\u0BC0\u0B95\u0BB0\u0BBF\u0B95\u0BCD\u0B95\u0BB5\u0BC1\u0BAE\u0BCD","Everything the verifier fully checked is approved in one step. Only flagged requirements (numbers to confirm, vague words, a disagreement) are reviewed one by one. The BRD and the app start building right away.":"\u0B9A\u0BB0\u0BBF\u0BAA\u0BBE\u0BB0\u0BCD\u0BAA\u0BCD\u0BAA\u0BB5\u0BB0\u0BCD \u0BAE\u0BC1\u0BB4\u0BC1\u0BAE\u0BC8\u0BAF\u0BBE\u0B95\u0B9A\u0BCD \u0B9A\u0BB0\u0BBF\u0BAA\u0BBE\u0BB0\u0BCD\u0BA4\u0BCD\u0BA4 \u0B85\u0BA9\u0BC8\u0BA4\u0BCD\u0BA4\u0BC1\u0BAE\u0BCD \u0B92\u0BB0\u0BC7 \u0B95\u0B9F\u0BCD\u0B9F\u0BA4\u0B
